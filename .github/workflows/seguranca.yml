name: Seguranca

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Toda segunda-feira, 06:00 UTC: pega segredos que passaram por revisao.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read  # o gitleaks-action lista os commits do PR
    steps:
      - uses: actions/checkout@v4
        with:
          # Historico completo: segredo apagado depois ainda esta no git.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
